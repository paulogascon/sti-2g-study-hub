<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>STI 2G Hub — iOS Mobile Simulator</title>
  <style>
    :root {
      --bg-editor: #18181b;
      --phone-outer: #0d1117;
      --titanium-rim: #272a33;
      --chassis-depth: #111317;
      --screen-w: 393px;
      --screen-h: 852px;
      --bezel-w: 413px;
      --bezel-h: 872px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-editor);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* CENTERED AUTO-FIT CANVAS WRAPPER */
    .simulator-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* IPHONE 15/16 PRO TITANIUM CHASSIS */
    .phone-device {
      position: relative;
      width: var(--bezel-w);
      height: var(--bezel-h);
      min-width: var(--bezel-w);
      min-height: var(--bezel-h);
      background: var(--phone-outer);
      border-radius: 54px;
      padding: 10px;
      box-shadow: 
        0 0 0 2.5px var(--titanium-rim),
        0 0 0 4.5px var(--chassis-depth),
        0 25px 65px -10px rgba(0, 0, 0, 0.88),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      transform-origin: center center;
      transition: transform 0.08s ease-out;
      will-change: transform;
    }

    /* PHONE INNER DISPLAY SCREEN */
    .phone-screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      background: #000000;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    /* AUTHENTIC iOS STATUS BAR */
    .ios-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      color: #ffffff;
    }

    .ios-time {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
      margin-left: 2px;
    }

    /* DYNAMIC ISLAND PILL */
    .dynamic-island {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      width: 122px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      z-index: 101;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
      box-shadow: 0 0 1px 1px rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dynamic-island:hover {
      width: 180px;
      height: 36px;
      border-radius: 22px;
    }

    .sensor-dot {
      width: 8px;
      height: 8px;
      background: #070c14;
      border-radius: 50%;
    }

    .camera-lens {
      width: 11px;
      height: 11px;
      background: radial-gradient(circle at 35% 35%, #1f3b60, #040810);
      border-radius: 50%;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* RIGHT STATUS ICONS: SIGNAL, 5G, BATTERY */
    .ios-status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ios-signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .ios-signal span {
      width: 3px;
      background: #ffffff;
      border-radius: 1px;
    }

    .ios-signal span:nth-child(1) { height: 4px; }
    .ios-signal span:nth-child(2) { height: 6px; }
    .ios-signal span:nth-child(3) { height: 8px; }
    .ios-signal span:nth-child(4) { height: 10px; }

    .ios-5g {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0 1px;
    }

    .ios-battery {
      width: 24px;
      height: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      border-radius: 4.5px;
      padding: 1.5px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .ios-battery::after {
      content: '';
      position: absolute;
      right: -3.5px;
      top: 3px;
      width: 2px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 0 1.5px 1.5px 0;
    }

    .ios-battery-fill {
      width: 88%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    /* APP IFRAME VIEWPORT */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #090e17;
      display: block;
    }

    /* HARDWARE HOME INDICATOR BAR (iOS) */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 9999px;
      z-index: 99;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* SUBTLE FLOATING CONTROLS (OUT OF THE WAY) */
    .floating-mini-bar {
      position: fixed;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.18;
      transition: opacity 0.25s ease;
      z-index: 999;
    }

    .floating-mini-bar:hover {
      opacity: 0.95;
    }

    .mini-btn {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .mini-btn:hover {
      color: #ffffff;
      background: rgba(37, 99, 235, 0.8);
      border-color: rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <!-- SIMULATOR VIEWPORT -->
  <div class="simulator-canvas">
    <div class="phone-device" id="phoneDevice">
      
      <!-- PHONE SCREEN -->
      <div class="phone-screen">
        
        <!-- AUTHENTIC iOS STATUS BAR -->
        <div class="ios-status-bar">
          <span class="ios-time" id="iosClock">9:17</span>

          <!-- DYNAMIC ISLAND -->
          <div class="dynamic-island" id="dynamicIsland" title="iPhone Dynamic Island">
            <div class="sensor-dot"></div>
            <div class="camera-lens"></div>
          </div>

          <!-- STATUS ICONS -->
          <div class="ios-status-icons">
            <div class="ios-signal">
              <span></span><span></span><span></span><span></span>
            </div>
            <span class="ios-5g">5G</span>
            <div class="ios-battery">
              <div class="ios-battery-fill"></div>
            </div>
          </div>
        </div>

        <!-- APP CONTENT IFRAME -->
        <iframe 
          src="index.html?sim=iphone&v=26" 
          class="app-frame" 
          id="appIframe" 
          title="STI 2G Study Hub">
        </iframe>

        <!-- iOS HOME INDICATOR -->
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <!-- FLOATING DISCREET RELOAD BUTTON (Fades out when not hovering) -->
  <div class="floating-mini-bar">
    <button class="mini-btn" onclick="reloadFrame()" title="Reload Application Frame (Press R)">
      🔄 Reload Hub
    </button>
  </div>

  <script>
    // AUTO-FIT ENGINE: Dynamically scales the phone to 100% fit any VS Code editor split pane
    function updateSimulatorScale() {
      const margin = 20; // 20px padding around phone
      const availW = window.innerWidth - margin * 2;
      const availH = window.innerHeight - margin * 2;
      const phoneW = 413;
      const phoneH = 872;

      // Scale to fit whichever dimension is tighter
      const scale = Math.min(availW / phoneW, availH / phoneH);
      const clampedScale = Math.max(Math.min(scale, 1.15), 0.22);

      const device = document.getElementById('phoneDevice');
      if (device) {
        device.style.transform = `scale(${clampedScale})`;
      }
    }

    // Dynamic iOS Real-Time Clock
    function updateIosClock() {
      const clock = document.getElementById('iosClock');
      if (!clock) return;
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      if (hours > 12) hours -= 12;
      if (hours === 0) hours = 12;
      clock.textContent = `${hours}:${minutes}`;
    }

    // Frame Reload Action
    function reloadFrame() {
      const frame = document.getElementById('appIframe');
      if (frame) {
        frame.src = 'index.html?sim=iphone&t=' + Date.now();
      }
    }

    // Listen to resize, orientation, and DOM ready events
    window.addEventListener('resize', updateSimulatorScale);
    window.addEventListener('orientationchange', updateSimulatorScale);
    window.addEventListener('DOMContentLoaded', () => {
      updateSimulatorScale();
      updateIosClock();
      setInterval(updateIosClock, 1000);
    });

    // Observe body resize for smooth split-pane dragging in VS Code
    if (window.ResizeObserver) {
      new ResizeObserver(updateSimulatorScale).observe(document.body);
    }

    // Keyboard shortcut: Press R to reload hub
    document.addEventListener('keydown', (e) => {
      if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag !== 'input' && activeTag !== 'textarea') {
          reloadFrame();
        }
      }
    });

    // Initial scale calculation
    updateSimulatorScale();
  </script>
</body>
</html>
