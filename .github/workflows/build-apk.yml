name: Build STI 2G Study Hub Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/STI_2G_Study_Hub.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "STI 2G Study Hub v1.0.0 (Android APK)"
          body: |
            ## 🎓 STI 2G Study Hub — Android APK Release
            
            Official Android Application for **STI West Negros University (BSIT 2G)**.
            
            ### 📱 Download Instructions:
            1. Tap **`STI_2G_Study_Hub.apk`** below to download.
            2. Tap the file and select **Install** on your Android phone.
            3. Enjoy full offline access to schedules, midterm reviewers, and handouts!
          files: release-output/STI_2G_Study_Hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
