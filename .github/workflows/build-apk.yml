name: Build STI 2G Study Hub Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/STI_2G_Study_Hub.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "STI 2G Study Hub v1.0.0 (Android APK)"
          body: |
            ## 🎓 STI 2G Study Hub — Official Android APK Release
            
            Official Android Application for **STI West Negros University (BSIT 2G)**.
            
            ### 📱 Download Instructions:
            1. Tap **`STI_2G_Study_Hub.apk`** below to download directly to your phone.
            2. Tap the file in your notification bar or **Downloads** folder and select **Install**.
            3. Enjoy 100% offline access to schedules, midterm reviewers, and flashcard quizzes!
          files: release-output/STI_2G_Study_Hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
