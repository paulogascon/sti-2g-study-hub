name: Build STI 2G Study Hub Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew || gradle wrapper
          gradle assembleDebug

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/STI_2G_Study_Hub.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STI_2G_Study_Hub_APK
          path: release-output/STI_2G_Study_Hub.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "STI 2G Study Hub v1.0.0 (Android APK)"
          body: |
            ## 🎓 STI 2G Study Hub — Android Application Release
            
            Download the official Android APK for **BSIT 2G** below.
            
            ### 📱 Download Instructions:
            1. Tap **`STI_2G_Study_Hub.apk`** below to download to your Android phone.
            2. When prompted, tap **Install** (allow install from this source if prompted).
            3. Open the app — it runs 100% offline with your full schedule, midterm reviewers, and handouts!
          files: release-output/STI_2G_Study_Hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
